# How this game is deployed.
#
# It has to be a WEB SERVICE, not a static site. The game files are served by
# server/index.js, which is also the thing that holds the accounts, the shared
# rooms and the chat a teacher can watch — a static host serves the pictures
# and none of the class.
#
# Without DATABASE_URL the server still boots and still serves the game; it
# reports sign-in as offline, and the browser falls back to guest play. That
# is the fallback, not the plan: signing in is what puts a name over a
# student's head, so the database is what makes multiplayer exist at all.
services:
  - type: web
    name: mesacs-0-2a
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mesacs-0-2a-db
          property: connectionString

databases:
  - name: mesacs-0-2a-db
    plan: free
    databaseName: mesacs
    user: mesacs
