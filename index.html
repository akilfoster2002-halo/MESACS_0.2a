<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Quest 0.2a — Mission: Linux</title>
<style>
*{box-sizing:border-box}
:root{
  /* pastel-arcade: soft world, deep plum UI so the HUD still reads over it */
  --ink:#241d38; --panel:#2e2547; --panel2:#3b3059; --line:#5a4b85;
  --accent:#8fd3ff; --good:#a8e6cf; --warn:#ffd8a8; --bad:#ff9aa2; --star:#ffe9a8;
  --mint:#a8e6cf; --peach:#ffb4a2; --lav:#cdb4f6; --blush:#ffc8dd; --sky:#8fd3ff;
  --text:#f4f0ff; --muted:#bdb2d8;
  --font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--font);
  -webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
.hidden{display:none !important}
button{font-family:var(--font);cursor:pointer}
.btn{background:var(--accent);color:#123045;border:none;border-radius:14px;padding:12px 20px;
  font-size:18px;font-weight:bold;box-shadow:0 4px 0 #5aa8d6}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5aa8d6}
.btn.small{font-size:14px;padding:8px 12px;box-shadow:0 3px 0 #5aa8d6}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 3px 0 #221b36}
.btn.good{background:var(--good);color:#13402f;box-shadow:0 4px 0 #6fc4a6}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6);border-radius:2px}
#crosshair::before{left:11px;top:0;width:4px;height:26px}
#crosshair::after{top:11px;left:0;height:4px;width:26px}
#crosshair.on::before,#crosshair.on::after{background:var(--peach);box-shadow:0 0 10px var(--peach)}
#crosshair.hit{animation:xhair .22s ease-out}
@keyframes xhair{0%{transform:scale(1.7);opacity:.4}100%{transform:scale(1);opacity:1}}
#focus{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:19px;
  background:rgba(8,12,20,.8);border:2px solid var(--line);border-radius:10px;padding:6px 14px;white-space:nowrap}
#focus small{display:block;font-size:14px;color:var(--star);text-align:center}

#objectives{position:absolute;right:14px;top:14px;width:290px;background:rgba(15,22,36,.92);
  border:3px solid var(--line);border-radius:14px;padding:12px;pointer-events:auto}
#objectives h2{margin:0 0 4px;font-size:17px;color:var(--accent);letter-spacing:1px}
#missionName{font-size:14px;color:var(--muted);margin-bottom:8px}
#objList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#objList li{font-size:14.5px;padding:7px 9px;border-radius:9px;background:#111a29;border-left:5px solid var(--line);color:var(--muted)}
#objList li.cur{border-left-color:var(--star);color:var(--text);background:#1b2740}
#objList li.done{border-left-color:var(--good);color:var(--good);text-decoration:line-through}

#briefing{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);max-width:620px;
  background:#fff6fb;color:#2a2140;border:3px solid var(--blush);border-radius:18px;padding:12px 18px;
  font-size:19px;line-height:1.35;box-shadow:0 12px 34px rgba(0,0,0,.55)}
#briefing b{color:#a4407a}

#mapwrap{position:absolute;left:14px;top:14px;background:rgba(15,22,36,.92);border:3px solid var(--line);
  border-radius:14px;padding:8px}
#mapwrap h3{margin:0 0 6px;font-size:13px;color:var(--muted);letter-spacing:1px;text-align:center}
#map{display:block;border-radius:8px;background:#0d1626}
#maplegend{font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px;line-height:1.35}

#keys{position:absolute;left:14px;bottom:14px;background:rgba(15,22,36,.9);border:2px solid var(--line);
  border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--muted);line-height:1.6}
#keys b{color:var(--text)}
#topbar{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;pointer-events:auto}


/* ---------- health, damage, hit feedback ---------- */
#health{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:340px;
  background:rgba(46,37,71,.9);border:3px solid var(--line);border-radius:16px;padding:8px 12px}
#health .hp-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);letter-spacing:1px}
#hpBar{height:16px;background:#1d1730;border-radius:9px;overflow:hidden;margin-top:5px;border:2px solid #4a3d70}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#a8e6cf,#8fd3ff);transition:width .25s}
#hpFill.low{background:linear-gradient(90deg,#ffb4a2,#ff9aa2)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
  box-shadow:inset 0 0 140px 40px rgba(255,120,150,.85);transition:opacity .25s}
#hurt.on{opacity:1}
#dmgNums{position:fixed;inset:0;pointer-events:none;z-index:16}
.dmg{position:absolute;font-size:22px;font-weight:bold;color:var(--peach);text-shadow:0 2px 6px #000;
  animation:floatup .8s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
#downed{position:fixed;inset:0;z-index:35;background:rgba(40,20,45,.86);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;font-size:26px;text-align:center}
/* mission door lock */
.lockbadge{position:absolute;pointer-events:none}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 50% 30%,#1b2c47,#0a0f18 70%);padding:20px}
.card{width:min(680px,94%);background:var(--panel);border:3px solid var(--line);border-radius:20px;
  padding:26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.card h1{margin:6px 0 4px;font-size:32px}
.card p{font-size:18px;line-height:1.45;color:var(--text)}
.card .sub{color:var(--muted);font-size:16px}
.langrow{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.langbtn{background:var(--panel2);border:3px solid var(--line);color:var(--text);border-radius:12px;padding:8px 16px;font-size:16px}
.langbtn.on{background:var(--accent);color:#04121f;border-color:#fff}
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:14px 0;text-align:left}
.ctrlgrid div{background:#111a29;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px;color:var(--muted)}
.ctrlgrid b{color:var(--star);display:inline-block;min-width:74px}


/* ---------- code console (block based) ---------- */
#console{position:fixed;inset:0;z-index:50;background:rgba(6,10,18,.82);display:flex;align-items:center;justify-content:center;padding:18px}
.con-card{width:min(1080px,97%);max-height:88vh;background:var(--panel);border:3px solid var(--line);
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.65)}
.con-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1b2740;font-size:17px;letter-spacing:1px}
.con-body{display:flex;gap:12px;padding:12px;overflow:auto;flex:1}
.con-col{width:250px;display:flex;flex-direction:column;gap:6px;min-height:0}
.con-col.grow{flex:1;width:auto}
.con-lbl{font-size:12px;letter-spacing:1.6px;color:var(--muted)}
#conPalette{display:flex;flex-direction:column;gap:8px}
.palblk{background:var(--c);border:none;border-radius:12px;padding:10px 12px;color:#fff;text-align:left;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.palblk b{display:block;font-size:17px}
.palblk small{font-size:12px;opacity:.9}
.palblk:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#conScript{flex:1;overflow:auto;background:#0e1626;border:3px dashed var(--line);border-radius:12px;padding:10px;min-height:190px}
.blk{background:var(--c);border-radius:10px;padding:9px 12px;margin:0 0 7px;color:#fff;font-size:17px;
  display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative}
.blk.on{outline:4px solid #8ff0ff;transform:scale(1.03)}
.blk.rep{display:block;padding:0;background:transparent;box-shadow:none}
.blk.rep .blk-head{background:var(--c);border-radius:10px 10px 0 0;padding:8px 12px;display:flex;align-items:center;gap:7px;font-size:17px}
.blk.rep .blk-body{margin-left:22px;border-left:8px solid var(--c);padding:8px 0 8px 10px;background:rgba(124,92,255,.10)}
.blk.rep .blk-foot{height:14px;background:var(--c);border-radius:0 0 10px 10px;margin-right:auto}
.blk.rep.target .blk-head{outline:3px dashed #fff}
.blk-x{margin-left:auto;background:rgba(0,0,0,.28);border:none;color:#fff;border-radius:7px;width:26px;height:26px;font-size:14px}
.cnt{background:rgba(0,0,0,.3);border:none;color:#fff;border-radius:6px;width:26px;height:26px;font-size:17px;line-height:1}
.cnt-n{min-width:26px;text-align:center;font-size:19px;font-weight:bold}
.blk-times{font-size:14px;opacity:.85}
.iter{margin-left:6px;font-size:14px;background:rgba(0,0,0,.35);border-radius:8px;padding:1px 7px}
.blk-empty{color:var(--muted);font-size:14px;padding:6px 8px;border:2px dashed var(--line);border-radius:8px}
.blk-empty.big{text-align:center;padding:22px 8px;font-size:16px}
#conText{flex:1;background:#0e1626;border:3px solid var(--line);border-radius:12px;padding:10px;margin:0;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:#8ff0ff;white-space:pre;overflow:auto}
.con-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#1b2740}
.con-hint{font-size:13.5px;color:var(--muted)}
.con-budget{display:inline-block;background:#1d1730;border:2px solid var(--line);border-radius:9px;
  padding:3px 10px;font-size:14px;margin-right:10px}
.con-budget b{color:var(--mint)} .con-budget b.over{color:var(--bad)}
/* puzzle timer */
#ptimer{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(46,37,71,.92);
  border:3px solid var(--line);border-radius:16px;padding:8px 18px;text-align:center;min-width:190px}
#ptimer .lbl{font-size:11px;letter-spacing:2px;color:var(--muted)}
#ptimer .clock{font-size:30px;font-weight:bold;color:var(--mint);font-variant-numeric:tabular-nums}
#ptimer .clock.warn{color:var(--warn)} #ptimer .clock.bad{color:var(--bad);animation:pulseT .6s infinite}
@keyframes pulseT{50%{opacity:.55}}
#ptimer .sub{font-size:12.5px;color:var(--muted)}
.stars{font-size:30px;letter-spacing:4px}
/* running program strip */
#tape{position:fixed;left:14px;bottom:80px;z-index:20;width:250px;max-height:52vh;overflow:auto;
  background:rgba(10,16,28,.94);border:3px solid var(--line);border-radius:14px;padding:10px;font-size:14px}
#tape .tape-lbl{font-size:11px;letter-spacing:1.6px;color:var(--star);margin-bottom:6px}
#tape .blk{font-size:14px;padding:6px 9px}
#tape .blk.rep .blk-head{font-size:14px;padding:6px 9px}
#tape .blk-x,#tape .cnt{display:none}

/* ---------- flat-mode transfer check ---------- */
#flat{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#12324a,#101a2c 55%,#0b1120);
  display:flex;flex-direction:column}
#flatTop{height:34px;background:rgba(8,12,20,.92);display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;font-size:14px;color:var(--muted);flex:none}
#flatDesk{flex:1;position:relative;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,104px);
  grid-auto-rows:104px;gap:6px;align-content:start}
#flatDock{height:56px;background:rgba(8,12,20,.92);display:flex;align-items:center;gap:10px;padding:0 12px;flex:none;font-size:15px}
.fi{width:104px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:12px;border:3px solid transparent;background:transparent;color:#fff;text-align:center}
.fi .em{font-size:42px}.fi .nm{font-size:13px;text-shadow:0 2px 4px #000}
.fi:hover{background:rgba(255,255,255,.1)}
.fi.sel{background:rgba(62,166,255,.3);border-color:var(--accent)}
.fwin{position:absolute;left:120px;top:70px;width:390px;height:250px;background:var(--panel);border:3px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.fwin-bar{height:40px;background:#2a3550;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;font-size:15px}
.fwin-x{width:32px;height:32px;border-radius:8px;border:none;background:#b23b3b;color:#fff;font-size:17px;font-weight:bold}
.fwin-body{flex:1;padding:12px;font-size:16px;color:var(--muted)}
#flatMsg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fffbe8;color:#1a1a1a;
  border:3px solid var(--star);border-radius:14px;padding:10px 16px;font-size:18px;max-width:560px;text-align:center}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="focus" class="hidden"></div>

  <div id="mapwrap">
    <h3 id="mapTitle">DESKTOP MAP</h3>
    <canvas id="map" width="190" height="140"></canvas>
    <div id="maplegend"></div>
  </div>

  <div id="objectives">
    <h2 id="objTitle">MISSION</h2>
    <div id="missionName"></div>
    <ol id="objList"></ol>
  </div>

  <div id="briefing"></div>
  <div id="ptimer" class="hidden">
    <div class="lbl" id="ptLbl">TIME</div>
    <div class="clock" id="ptClock">0:00</div>
    <div class="sub" id="ptSub"></div>
  </div>
  <div id="health" class="hidden">
    <div class="hp-top"><span id="hpLbl">HEALTH</span><span id="hpNum">100</span></div>
    <div id="hpBar"><div id="hpFill"></div></div>
  </div>
  <div id="keys"></div>
  <div id="topbar">
    <button class="btn small ghost hidden" id="btnLeave">⏏ Leave</button>
    <button class="btn small ghost" id="btnLang">🌐 Español</button>
    <button class="btn small ghost" id="btnHelp">❔</button>
  </div>
</div>

<div id="hurt"></div>
<div id="dmgNums"></div>
<div id="downed" class="hidden"></div>

<div id="start" class="screen">
  <div class="card">
    <div class="langrow">
      <button class="langbtn" data-lang="en">🇺🇸 English</button>
      <button class="langbtn" data-lang="es">🇲🇽 Español</button>
    </div>
    <div style="font-size:56px">🐧🎯</div>
    <h1 id="sTitle">Mission: Linux</h1>
    <p class="sub" id="sSub"></p>
    <p id="sBody"></p>
    <div class="ctrlgrid" id="sCtrl"></div>
    <button class="btn good" id="sGo">▶</button>
    <p class="sub" id="sNote" style="font-size:14px"></p>
  </div>
</div>

<div id="done" class="screen hidden">
  <div class="card">
    <div style="font-size:56px">🏅</div>
    <h1 id="dTitle"></h1>
    <p id="dBody"></p>
    <div id="dStats" class="ctrlgrid"></div>
    <button class="btn" id="dAgain"></button>
  </div>
</div>

<div id="flat" class="hidden">
  <div id="flatTop"><span id="flatTopL"></span><span id="flatTopR"></span></div>
  <div id="flatDesk"></div>
  <div id="flatDock"></div>
  <div id="flatMsg"></div>
</div>

<script src="lib/three.classic.js"></script>
<script src="strings.js?v=5"></script>
<script src="levels.js?v=5"></script>
<script src="code.js?v=5"></script>
<script src="combat.js?v=5"></script>
<script src="puzzle.js?v=5"></script>
<script src="game.js?v=5"></script>
</body>
</html>
